spring.application.name=cafeteria-api

# ============================================================
# DATASOURCE 1 - PORTAL DE CLIENTES (CAFETERIA_CLIENTE_APP)
# Solo puede: ver menu/sucursales, registrarse, autenticarse,
# ver/editar su perfil y crear sus pedidos/pagos.
# ============================================================
app.datasource.cliente.jdbc-url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
app.datasource.cliente.username=CAFETERIA_CLIENTE_APP
app.datasource.cliente.password=cofy0929
app.datasource.cliente.driver-class-name=oracle.jdbc.OracleDriver
app.datasource.cliente.maximum-pool-size=5

# ============================================================
# DATASOURCE 2 - PANEL INTERNO (CAFETERIA_EMPLEADO_APP)
# Empleados, supervisores y admin: gestion de pedidos, pagos,
# turnos, metricas e inventario (requiere Script 4).
# ============================================================
app.datasource.empleado.jdbc-url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
app.datasource.empleado.username=CAFETERIA_EMPLEADO_APP
app.datasource.empleado.password=cofy0929
app.datasource.empleado.driver-class-name=oracle.jdbc.OracleDriver
app.datasource.empleado.maximum-pool-size=5

# ============================================================
# JWT (tokens de sesion del API)
# ============================================================
app.jwt.secret=cafeteria-dev-secret-2026-cambiar-en-produccion-0929!
app.jwt.expiration-ms=86400000

# ============================================================
# CLAVES DE REGISTRO (funcionan como codigo de invitacion)
# Si alguien se registra usando EXACTAMENTE una de estas claves
# como contrasena, queda creado como TRABAJADOR (BARISTA o ADMIN)
# en vez de cliente. Despues debe cambiarla con PUT /api/auth/password.
# *** CAMBIALAS: quien las conozca puede volverse empleado/admin ***
# ============================================================
app.registro.password-empleado=empleado123
app.registro.password-admin=admin123

# ============================================================
# JPA - OPEN IN VIEW
# Desactivado a proposito: con DOS datasources, dejarlo activo
# (el default de Spring Boot) mantiene el mismo EntityManager
# abierto durante toda la peticion HTTP y puede devolver datos
# en cache de una lectura anterior en vez de re-consultar Oracle
# (por ejemplo, al confirmar un pago y releer el pedido). Al
# desactivarlo, cada llamada a un repositorio abre su propia
# conexion/transaccion y siempre lee el estado real de la BD.
# ============================================================
spring.jpa.open-in-view=false

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080
