spring.application.name=cafeteria-api

# ============================================================
# SECRETOS (fuera del control de versiones)
# Los valores reales se resuelven, en orden de prioridad:
#   1. Variables de entorno (producción)
#   2. ./secrets.properties  (desarrollo; NO se versiona)
# Si falta alguno, la app NO arranca (fail-closed). Ver
# secrets.properties.example para la plantilla.
# ============================================================
spring.config.import=optional:file:./secrets.properties

# ============================================================
# DATASOURCE 1 - PORTAL DE CLIENTES (CAFETERIA_CLIENTE_APP)
# Solo puede: ver menu/sucursales, registrarse, autenticarse,
# ver/editar su perfil y crear sus pedidos/pagos.
# ============================================================
app.datasource.cliente.jdbc-url=jdbc:oracle:thin:@//${DB_HOST:localhost:1521}/${DB_SERVICE:XEPDB1}
app.datasource.cliente.username=${DB_CLIENTE_USERNAME:CAFETERIA_CLIENTE_APP}
app.datasource.cliente.password=${DB_CLIENTE_PASSWORD}
app.datasource.cliente.driver-class-name=oracle.jdbc.OracleDriver
app.datasource.cliente.maximum-pool-size=5

# ============================================================
# DATASOURCE 2 - PANEL INTERNO (CAFETERIA_EMPLEADO_APP)
# Empleados, supervisores y admin: gestion de pedidos, pagos,
# turnos, metricas e inventario (requiere Script 4).
# ============================================================
app.datasource.empleado.jdbc-url=jdbc:oracle:thin:@//${DB_HOST:localhost:1521}/${DB_SERVICE:XEPDB1}
app.datasource.empleado.username=${DB_EMPLEADO_USERNAME:CAFETERIA_EMPLEADO_APP}
app.datasource.empleado.password=${DB_EMPLEADO_PASSWORD}
app.datasource.empleado.driver-class-name=oracle.jdbc.OracleDriver
app.datasource.empleado.maximum-pool-size=5

# ============================================================
# JWT (tokens de sesion del API)
# El secreto debe tener >= 32 bytes (HS256). Se inyecta por entorno.
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# CLAVES DE REGISTRO (funcionan como codigo de invitacion)
# Si alguien se registra usando EXACTAMENTE una de estas claves
# como contrasena, queda creado como TRABAJADOR (BARISTA o ADMIN)
# en vez de cliente. Despues debe cambiarla con PUT /api/auth/password.
#
# *** Son SECRETOS: se inyectan por entorno, deben ser largos y
#     aleatorios, y estan protegidos por rate limiting (ver abajo).
#     Quien las conozca puede volverse empleado/admin. ***
# ============================================================
app.registro.password-empleado=${REGISTRO_PASSWORD_EMPLEADO}
app.registro.password-admin=${REGISTRO_PASSWORD_ADMIN}

# ============================================================
# PASARELA DE PAGOS
# La confirmacion SIMULADA (POST /api/pedidos/{id}/pago/confirmar)
# permite que el propio cliente apruebe su pago: solo apto para
# desarrollo. En produccion se pone en false y la aprobacion debe
# llegar por webhook firmado de la pasarela real.
# ============================================================
app.pagos.simulacion-habilitada=${PAGOS_SIMULACION_HABILITADA:true}

# ============================================================
# CORS (origenes permitidos del frontend, separados por coma)
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ============================================================
# JPA
# open-in-view desactivado a proposito: con DOS datasources, dejarlo
# activo mantiene el mismo EntityManager abierto durante toda la
# peticion y puede devolver datos en cache de una lectura anterior.
# show-sql desactivado por defecto (evita volcar SQL a los logs);
# actívalo solo en desarrollo con JPA_SHOW_SQL=true.
# ============================================================
spring.jpa.open-in-view=false
app.jpa.show-sql=${JPA_SHOW_SQL:false}

# ============================================================
# SERVIDOR
# ============================================================
server.port=${SERVER_PORT:8080}

# ============================================================
# MANEJO DE ERRORES
# Nunca exponer el stack trace al cliente (fuga de información),
# ni siquiera con devtools en el classpath. Sí devolver el mensaje
# de negocio (ResponseStatusException) y los errores de validación.
# ============================================================
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
